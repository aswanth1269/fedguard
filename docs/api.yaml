# ---------------------------------------------------------------------------
# FedGuard API contract
#
# GENERATED FILE - do not edit by hand.
#   Regenerate:  python scripts/export_openapi.py
#   Verify:      python scripts/export_openapi.py --check   (CI runs this)
#
# Edit the FastAPI route or the pydantic model instead; this file follows.
#
# CROSS-TEAM RULES (DESIGN.md)
#   This contract changes only by PR, and both Nikunj (blockchain service) and
#   Alankrita (dashboard) must be notified of any change. Adding a route is
#   additive and safe. Renaming or removing a field is a breaking change for
#   code you cannot see - treat it as one.
#
# KNOWN DIVERGENCE FROM docs/PLAN.md PART 4
#   PLAN.md Part 4 sketched unscoped routes - GET /model-status, GET
#   /agent-summary. What is actually implemented is job-scoped:
#   GET /model-status/{job_id}. The harness runs all N rounds inside one
#   run_experiment call, so a job id is the only thing that identifies "which
#   run" - there is no persistent notion of "the current model" for an
#   unscoped route to return. POST /predict is the exception and does resolve
#   the latest completed job, because scoring has to work without the caller
#   knowing anything about training.
#
#   The PLAN.md /predict sketch also took raw transaction fields
#   (amount, merchant, location) and returned a "Fraud" string. What is
#   implemented takes engineered features and always returns the raw score.
#   PLAN.md Part 2 Conflict 3 explains why the sketch was not implementable.
#
#   POST /store-model is NOT in this spec. It is the blockchain service's own
#   endpoint - Nikunj's surface, not this one. fedguard CALLS it through
#   coordinator/blockchain_client.py's LedgerClient interface. See
#   blockchain/README.md.
# ---------------------------------------------------------------------------
openapi: 3.1.0
info:
  title: FedGuard API
  description: 'Coordinator-reviewed federated fraud detection: training, prediction and audit endpoints
    over the batch simulation harness.'
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /train:
    post:
      summary: Train
      description: 'Starts a full N-round run in the background and returns immediately.


        A run takes minutes, not milliseconds - pairing this with a separate

        GET /model-status only makes sense if this endpoint does not block for

        the run''s duration. Poll /model-status/{job_id} for completion; because

        run_experiment is one monolithic call internally, status jumps straight

        from "running" to "complete"/"failed" - there is no partial-round

        progress to report without the same core-loop restructuring the

        Federated endpoints below also avoid.'
      operationId: train_train_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentConfig'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /model-status:
    get:
      summary: Current Model Status
      description: 'Returns the latest completed training job''s metadata and expected features,

        or status=''no_job'' if none has run yet.'
      operationId: current_model_status_model_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentModelStatusResponse'
  /demo/warmup:
    post:
      summary: Demo Warmup
      description: 'Trains the demo model from configs/demo_mlp.yaml (PyTorch MLP, three

        simulated banks, reputation defense, synthetic data).


        Returns an already queued/running job instead of starting a second one,

        and returns the last completed job unless ``force=true`` asks for a new

        training run.'
      operationId: demo_warmup_demo_warmup_post
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /verify-transaction-hash:
    post:
      summary: Verify Transaction Hash
      description: 'Computes the canonical SHA-256 digest of arbitrary payload using the exact

        canonical serialization (keys sorted, no whitespace) used by the ledger and

        blockchain commitments, and optionally verifies against a baseline reference.'
      operationId: verify_transaction_hash_verify_transaction_hash_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyHashRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyHashResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /model-status/{job_id}:
    get:
      summary: Model Status
      operationId: model_status_model_status__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Model Status Model Status  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /training-round/{job_id}:
    get:
      summary: Training Round
      description: 'That job''s `result.rounds` so far - eval metrics, the defense''s

        AggregationDecision, the agent''s verdict and narrative, per round.

        Empty while the job is still queued/running, not an error.'
      operationId: training_round_training_round__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Training Round Training Round  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /participants/{job_id}:
    get:
      summary: Participants
      description: 'Client roster rolled up from every round completed so far - not

        fabricated, and not a re-run of the partition step: `accepted`/`rejected`

        on each round''s AggregationDecision already names every client that took

        part, per the contract every Defense subclass is required to satisfy.'
      operationId: participants_participants__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Participants Participants  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent-status/{job_id}:
    get:
      summary: Agent Status
      operationId: agent_status_agent_status__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Status Agent Status  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent-summary/{job_id}:
    get:
      summary: Agent Summary
      description: 'A readable rollup, built deterministically from already-recorded

        verdicts - not a second LLM call. The agent''s narrative already ran once

        per round inside CoordinatorAgent.review(); this just summarises the

        facts, the same discipline agent.py itself applies to what an LLM is

        trusted to add.'
      operationId: agent_summary_agent_summary__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Summary Agent Summary  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /approve-model:
    post:
      summary: Approve Model
      description: 'Records a human override on one round - "a person reviewed this

        agent flag and confirms it''s fine." Every round is already anchored to

        the ledger regardless of the agent''s verdict (see experiment.py''s

        ANCHORING step - a flagged round is content that belongs on the chain,

        not a reason to skip writing it), so this override does not gate

        anchoring the way it might sound like it should. It also does NOT touch

        the already-anchored ledger entry: mutating anchored content would

        silently break the chain''s own tamper-evidence, exactly the property

        the ledger exists to provide. This stays a separate, out-of-band note.


        In-memory only, like the rest of the job store: this mutates the round''s

        stored dict in the job store, but that round''s lines in

        results/runs.jsonl and results/ledger.jsonl were already written by the

        time a job reaches COMPLETE. A server restart loses this note, same as

        every other in-flight job-store state.'
      operationId: approve_model_approve_model_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveModelRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Approve Model Approve Model Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /predict:
    post:
      summary: Predict
      description: 'Scores against the last completed job''s final model - fedguard has

        no persisted "current production model" to fall back on otherwise.'
      operationId: predict_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /explain:
    post:
      summary: Explain Prediction
      description: 'Why the model scored this input as it did: exact Shapley values over the

        raw inputs (see api/explain.py). Separate from /predict on purpose, so an

        explanation failure can never block or alter a score.'
      operationId: explain_prediction_explain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ledger:
    get:
      summary: Ledger
      description: 'The full chain, or one run''s slice via `?config_hash=`. No public

        write path exists - see experiment.py''s ANCHORING step and

        coordinator/blockchain_client.py''s module docstring for why: a public

        POST here would let anyone construct a self-consistent fabricated chain

        that still "verifies," which is worse than no ledger at all.'
      operationId: ledger_ledger_get
      parameters:
      - name: config_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Hash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ledger Ledger Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ledger/{job_id}:
    get:
      summary: Ledger For Job
      operationId: ledger_for_job_ledger__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ledger For Job Ledger  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /verify:
    get:
      summary: Verify
      description: 'Walks the whole chain and reports exactly which entry failed and why,

        the first time something disagrees - see ledger/chain.py''s

        VerificationResult. This is the actual tamper-evidence check; /audit

        below is a readable summary, not a substitute for this.'
      operationId: verify_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Verify Verify Get
  /audit/{job_id}:
    get:
      summary: Audit
      description: 'Human-readable rollup of one job''s ledger entries. Not an integrity

        check on its own - the ledger is one shared chain across every job

        submitted to this server, so "verify just this job''s slice" is not a

        well-formed operation; GET /verify covers the whole chain.'
      operationId: audit_audit__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Audit Audit  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /transactions:
    post:
      summary: Ingest Transaction
      description: 'Scores one transaction with the current global model and appends it to

        the feed. ``transaction_id`` is deduplicated (409 on a repeat).'
      operationId: ingest_transaction_transactions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Transaction Transactions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Transactions
      description: 'Events with ``seq > after``, oldest first. Poll with the returned

        ``latest_seq`` as the next ``after`` to receive each event exactly once.'
      operationId: list_transactions_transactions_get
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Transactions Transactions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /demo/transactions:
    post:
      summary: Demo Transactions
      description: 'SYNTHETIC demonstration traffic. Draws the next rows from a held-out

        synthetic block, scores each with the real model, and labels every event

        ``source: "synthetic_demo"``. This is not a bank feed.'
      operationId: demo_transactions_demo_transactions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoTransactionsRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Demo Transactions Demo Transactions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /integrity/status:
    get:
      summary: Integrity Status
      operationId: integrity_status_integrity_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Integrity Status Integrity Status Get
  /banks:
    get:
      summary: Banks
      description: 'Every enrolled bank plus every bank in the latest federation, with its

        real contribution history. Nothing here is estimated.'
      operationId: banks_banks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Banks Banks Get
  /artifacts:
    get:
      summary: List Artifacts
      operationId: list_artifacts_artifacts_get
      parameters:
      - name: artifact_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Type
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Artifacts Artifacts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /artifacts/{seq}:
    get:
      summary: Get Artifact
      operationId: get_artifact_artifacts__seq__get
      parameters:
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          title: Seq
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Artifact Artifacts  Seq  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /artifacts/{seq}/download:
    get:
      summary: Download Artifact
      description: 'Model artifacts only. Datasets stay on the coordinator - they are bank

        transaction data and never leave through the API.'
      operationId: download_artifact_artifacts__seq__download_get
      parameters:
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          title: Seq
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /artifacts/{seq}/verify:
    post:
      summary: Verify Artifact
      description: 'Checks candidate content against version ``seq``''s trusted hash.

        ``stored`` re-hashes the stored file, ``modified_copy`` alters an in-memory

        copy (the stored file is never touched), ``upload`` checks your file.'
      operationId: verify_artifact_artifacts__seq__verify_post
      parameters:
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          title: Seq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyArtifactRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyArtifactResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /artifacts/submit:
    post:
      summary: Submit Artifact
      description: 'The real submission path: the member signs

        ``artifacts.signing.submission_message`` with its own key, off-server.'
      operationId: submit_artifact_artifacts_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitArtifactRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /demo/bank-signer/model-update:
    post:
      summary: Demo Signer Model Update
      description: "SIMULATED BANK SIGNER. Builds a model update for a simulated bank,\nsigns it with\
        \ that bank's server-held key, and sends it through the exact\nsame validation pipeline as POST\
        \ /artifacts/submit. Each scenario shapes\nonly the INPUT; the outcome is whatever the decision\
        \ engine returns.\n\nlegitimate_retrain - real local training from the round's base model on\n\
        \    the bank's own partition (one more epoch per existing version, so each\n    retrain is a\
        \ genuinely new update)\nmalicious_update   - that retrain, then the project's own sign-flip attack\n\
        \    (attacks/sign_flip.py, scale 5), correctly signed by the bank\nimpersonation      - another\
        \ bank signs a submission claiming to be this one\ninvalid_signature  - a valid signature over\
        \ different content\nwrong_architecture - a correctly signed update from a differently shaped\
        \ MLP\nbank_publishes_global_model - the bank tries to publish a global model"
      operationId: demo_signer_model_update_demo_bank_signer_model_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSignerModelUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /demo/bank-signer/upload:
    post:
      summary: Demo Signer Upload
      description: 'SIMULATED BANK SIGNER for a file chosen in the browser (a dataset CSV

        or a model-update .npz). The browser never holds a key, so the server

        signs as the simulated bank, then validates exactly as /artifacts/submit.'
      operationId: demo_signer_upload_demo_bank_signer_upload_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSignerUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActiveJob:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        config_name:
          type: string
          title: Config Name
        model_name:
          type: string
          title: Model Name
        rounds_done:
          type: integer
          title: Rounds Done
        rounds_total:
          type: integer
          title: Rounds Total
        submitted_at:
          type: number
          title: Submitted At
      type: object
      required:
      - job_id
      - status
      - config_name
      - model_name
      - rounds_done
      - rounds_total
      - submitted_at
      title: ActiveJob
    ApproveModelRequest:
      properties:
        job_id:
          type: string
          title: Job Id
        round_num:
          type: integer
          title: Round Num
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - job_id
      - round_num
      title: ApproveModelRequest
    AttackConfig:
      properties:
        name:
          type: string
          enum:
          - none
          - label_flip
          - sign_flip
          - backdoor
          title: Name
          default: none
        malicious_clients:
          items:
            type: string
          type: array
          title: Malicious Clients
        active_rounds:
          anyOf:
          - type: string
          - items:
              type: integer
            type: array
          title: Active Rounds
          default: all
        params:
          additionalProperties: true
          type: object
          title: Params
      type: object
      title: AttackConfig
    CoordinatorConfig:
