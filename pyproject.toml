[project]
name = "fedguard"
version = "0.1.0"
description = "Adversarially-robust federated learning for fraud detection"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "flwr[simulation]>=1.8",
    "lightgbm>=4.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx2>=2.12",  # transport fastapi.testclient.TestClient needs on this starlette version
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
data = [
    # Only needed to FETCH IEEE-CIS. Left out of the core dependencies so a
    # clone can install, test and run the synthetic path without a Kaggle
    # account - CI has no credentials and must never need them.
    "kaggle>=1.6",
    # Parquet cache for the joined 683 MB CSV. Optional at runtime: loader.py
    # degrades to re-parsing the CSVs if it is absent.
    "pyarrow>=15.0",
]
explain = [
    "shap>=0.45",
    "matplotlib>=3.8",
]

[project.scripts]
fedguard = "fedguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: runs a full federated simulation; excluded from CI by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
packages = ["fedguard"]
ignore_missing_imports = true
# Deliberately not strict everywhere. Tighten as the codebase settles.
disallow_untyped_defs = false
